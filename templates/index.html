<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AI Chat</title>
<style>
  :root {
    --bg: #0f1410;
    --panel: #161d18;
    --line: #2a332c;
    --text: #e9efe9;
    --muted: #8fa090;
    --accent: #7fd99a;
    --accent-dim: #3f5f49;
    --user-bubble: #1f2a21;
    --ai-bubble: #182018;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Segoe UI", system-ui, sans-serif;
    display: flex;
    justify-content: center;
    min-height: 100vh;
    padding: 32px 16px;
  }
  .app {
    width: 100%;
    max-width: 640px;
    display: flex;
    flex-direction: column;
    height: calc(100vh - 64px);
  }
  header {
    display: flex;
    align-items: baseline;
    gap: 10px;
    margin-bottom: 18px;
    border-bottom: 1px solid var(--line);
    padding-bottom: 14px;
  }
  header .dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 8px var(--accent);
  }
  header h1 {
    font-size: 1.15rem;
    font-weight: 600;
    margin: 0;
    letter-spacing: 0.2px;
  }
  header span {
    color: var(--muted);
    font-size: 0.85rem;
  }
  #chatbox {
    flex: 1;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 12px;
    padding: 4px 4px 12px;
  }
  #chatbox:empty::before {
    content: "Ask it anything. It remembers the conversation as you go.";
    color: var(--muted);
    font-size: 0.9rem;
  }
  .row {
    display: flex;
  }
  .row.user { justify-content: flex-end; }
  .row.ai { justify-content: flex-start; }
  .bubble {
    max-width: 80%;
    padding: 10px 14px;
    border-radius: 10px;
    line-height: 1.5;
    font-size: 0.95rem;
    white-space: pre-wrap;
    word-wrap: break-word;
  }
  .row.user .bubble {
    background: var(--user-bubble);
    border: 1px solid var(--accent-dim);
    border-bottom-right-radius: 2px;
  }
  .row.ai .bubble {
    background: var(--ai-bubble);
    border: 1px solid var(--line);
    border-bottom-left-radius: 2px;
  }
  .label {
    display: block;
    font-size: 0.7rem;
    text-transform: lowercase;
    color: var(--muted);
    margin-bottom: 4px;
  }
  .bubble code {
    background: #0b0f0b;
    padding: 1px 5px;
    border-radius: 4px;
    font-family: "Cascadia Code", Consolas, monospace;
    font-size: 0.85em;
  }
  .bubble pre {
    background: #0b0f0b;
    border: 1px solid var(--line);
    padding: 10px 12px;
    border-radius: 8px;
    overflow-x: auto;
    font-family: "Cascadia Code", Consolas, monospace;
    font-size: 0.82rem;
    margin: 6px 0 0;
  }
  form {
    display: flex;
    gap: 8px;
    margin-top: 14px;
    border-top: 1px solid var(--line);
    padding-top: 14px;
  }
  input[type="text"] {
    flex: 1;
    background: var(--panel);
    border: 1px solid var(--line);
    color: var(--text);
    padding: 11px 14px;
    border-radius: 8px;
    font-size: 0.95rem;
    outline: none;
  }
  input[type="text"]:focus {
    border-color: var(--accent-dim);
  }
  button {
    background: var(--accent);
    color: #0f1410;
    border: none;
    padding: 0 20px;
    border-radius: 8px;
    font-weight: 600;
    font-size: 0.9rem;
    cursor: pointer;
  }
  button:disabled {
    opacity: 0.5;
    cursor: default;
  }
  .typing {
    color: var(--muted);
    font-size: 0.85rem;
    font-style: italic;
  }
</style>
</head>
<body>
  <div class="app">
    <header>
      <span class="dot"></span>
      <h1>AI Chat</h1>
      <span>&mdash; Gemini-backed assistant</span>
    </header>

    <div id="chatbox"></div>

    <form id="chatForm">
      <input type="text" id="userInput" placeholder="Type a message..." autocomplete="off" />
      <button type="submit" id="sendBtn">Send</button>
    </form>
  </div>

<script>
  const chatbox = document.getElementById("chatbox");
  const form = document.getElementById("chatForm");
  const input = document.getElementById("userInput");
  const sendBtn = document.getElementById("sendBtn");

  function escapeHtml(str) {
    return str.replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
  }

  // Render ```code``` blocks and `inline code` without any extra libraries
  function formatText(text) {
    let safe = escapeHtml(text);
    safe = safe.replace(/```(\w*)\n([\s\S]*?)```/g, (_, lang, code) => `<pre>${code.trim()}</pre>`);
    safe = safe.replace(/`([^`]+)`/g, "<code>$1</code>");
    return safe;
  }

  function addBubble(role, text) {
    const row = document.createElement("div");
    row.className = "row " + role;
    const bubble = document.createElement("div");
    bubble.className = "bubble";
    bubble.innerHTML = `<span class="label">${role === "user" ? "you" : "ai"}</span>${formatText(text)}`;
    row.appendChild(bubble);
    chatbox.appendChild(row);
    chatbox.scrollTop = chatbox.scrollHeight;
    return bubble;
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const message = input.value.trim();
    if (!message) return;

    addBubble("user", message);
    input.value = "";
    sendBtn.disabled = true;

    const typingRow = document.createElement("div");
    typingRow.className = "row ai";
    typingRow.innerHTML = `<div class="bubble typing">thinking…</div>`;
    chatbox.appendChild(typingRow);
    chatbox.scrollTop = chatbox.scrollHeight;

    try {
      const res = await fetch("/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message }),
      });
      const data = await res.json();
      typingRow.remove();
      addBubble("ai", data.reply || data.error || "Something went wrong.");
    } catch (err) {
      typingRow.remove();
      addBubble("ai", "Network error, please try again.");
    } finally {
      sendBtn.disabled = false;
      input.focus();
    }
  });
</script>
</body>
</html>
